name: Dev - Bhojnam React

on:
  push:
    branches:
      - dev-env

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        ref: dev-env

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18.x'

    - name: Create .env file from secrets
      run: |
        echo "VITE_BASE_API_URL=${{ secrets.VITE_BASE_API_URL }}" >> .env    

    - name: Install dependencies
      run: npm install

    - name: Build React App
      env:
        VITE_BASE_API_URL: ${{ secrets.VITE_BASE_API_URL }}
      run: npm run build

    - name: Archive dist artifacts
      run: tar -czf dist.tar.gz -C dist .

    - name: Upload dist artifact
      uses: actions/upload-artifact@v4
      with:
        name: dist-artifact
        path: dist.tar.gz
        retention-days: 3 

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-artifact

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.5.3
        with:
         ssh-private-key: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEYS }}

      - name: Copy dist.tar.gz to server
        run: scp -o StrictHostKeyChecking=no -P 22 dist.tar.gz ${{ secrets.HOSTINGER_USERNAME }}@${{ secrets.HOSTINGER_HOST }}:/home/amritbhojanam-dev-react/htdocs/dev-react.amritbhojanam.com/

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v0.1.7
        with:
         host: ${{ secrets.HOSTINGER_HOST }}
         username: ${{ secrets.HOSTINGER_USERNAME }}
         key: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEYS }}
         port: 22
         script: |
           cd /home/amritbhojanam-dev-react/htdocs/dev-react.amritbhojanam.com
           rm -rf dist
           tar -xzf dist.tar.gz
           rm -rf dist.tar.gz
           sudo systemctl restart nginx
           
      - name: Clean up
        run: rm dist.tar.gz
